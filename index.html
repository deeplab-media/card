<!doctype html>
<html lang="vi" class="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deeplab Media — Liên hệ</title>
<meta name="description" content="Deeplab Media · Sản xuất video, TikTok và 3D. Website và Zalo trực tiếp.">
<meta name="theme-color" content="#000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="Deeplab Media — Liên hệ">
<meta property="og:url" content="https://deeplab-media.github.io/card/">
<meta property="og:image" content="https://deeplab-media.github.io/card/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:description" content="Video, TikTok & 3D cho doanh nghiệp. Nhắn Zalo trực tiếp cho Sinh hoặc Trinh.">
<link rel="icon" type="image/png" href="apple-touch-icon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" as="image" crossorigin="anonymous" href="assets/card_back.webp">
<link rel="preload" as="image" crossorigin="anonymous" href="assets/card_sinh.webp">
<link rel="preload" as="image" crossorigin="anonymous" href="assets/card_trinh.webp">
<link rel="preconnect" href="https://media.deeplabassist.vn">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--sub:rgba(255,255,255,.66);--zalo:#0068ff;--disp:"Anton",Impact,sans-serif;--ui:"Be Vietnam Pro",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overscroll-behavior-y:none}
body{background:#000;color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a,button{touch-action:manipulation;color:inherit;text-decoration:none;-webkit-user-select:none;user-select:none}
img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;display:block}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;gap:12px;overflow:clip;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}

/* brand */
.brand{display:flex;flex-direction:column;align-items:center;gap:7px}
.lock{position:relative;display:flex;align-items:center;gap:12px}
.lock::before{content:"";position:absolute;inset:-18px -40px;z-index:-1;background:radial-gradient(closest-side,rgba(120,190,255,.2),transparent);filter:blur(6px)}
.mark{height:36px;width:auto}.word{height:26px;width:auto}
.wordtxt{font-family:var(--disp);font-size:28px;letter-spacing:.12em}
.tag{display:flex;align-items:center;gap:10px;font-size:9.5px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--sub)}
.tag i{width:22px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5))}
.tag i:last-child{transform:scaleX(-1)}

/* hero */
.hero{position:relative;display:block;border-radius:22px;overflow:hidden;flex:1 1 30%;min-height:150px;isolation:isolate}
.hero video,.hero img.p{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero video{opacity:0;transition:opacity .8s}.hero video.on{opacity:1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.85) 100%)}
.hero .row{position:absolute;left:0;right:0;bottom:0;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero h1{font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.02;text-transform:uppercase}
.wbtn{flex-shrink:0;height:42px;padding:0 16px;border-radius:13px;background:#fff;color:#000;font-size:13.5px;font-weight:700;display:flex;align-items:center}

/* deck slot (cards are drawn by WebGL on top of it) */
.deck{position:relative;flex:0 0 auto;width:100%;aspect-ratio:1.667/1.18;cursor:pointer;outline:none}
.fb .card{position:absolute;left:5%;width:90%;aspect-ratio:1203/721;top:10%;border-radius:3.2%/5.4%;overflow:hidden;box-shadow:0 22px 40px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07)}
.fb .card img{width:100%;height:100%}
.fb .top{z-index:2;transform:translate(1%,8%) rotate(2.2deg)}
.fb .bot{z-index:1;transform:translate(-2%,-7%) rotate(-5deg) scale(.95);filter:brightness(.78)}
.gl .fb{display:none}

/* zalo */
.zrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zb{height:50px;border-radius:15px;background:var(--zalo);display:flex;align-items:center;gap:9px;padding:0 12px;
  box-shadow:0 10px 24px rgba(0,104,255,.38);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.zb:active{transform:scale(.95)}
.zb svg{width:28px;height:28px;flex-shrink:0}
.zb span{display:flex;flex-direction:column;line-height:1.15;font-size:13.5px;font-weight:700}
.zb small{font-size:10px;font-weight:400;opacity:.8;white-space:nowrap}

/* layers */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
.curtain{position:fixed;inset:0;z-index:30;background:#000}
.snd{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:60;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .6s}
.snd.show{opacity:1}
.snd i{display:flex;align-items:flex-end;gap:2px;height:14px}
.snd i b{width:2.5px;background:#fff;border-radius:2px;height:4px;animation:eq 1s ease-in-out infinite}
.snd i b:nth-child(2){animation-delay:.2s}.snd i b:nth-child(3){animation-delay:.4s}.snd i b:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.snd.off i b{animation:none;height:3px;opacity:.6}
.snd.wait{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}60%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.fade{opacity:0}

@media (max-width:350px){.zb{gap:7px;padding:0 9px}.zb svg{width:24px;height:24px}.zb span{font-size:12.5px}.zb small{font-size:9px}}
@media (max-height:700px){.app{gap:9px}.hero{min-height:120px}.hero h1{font-size:28px}.mark{height:30px}.word{height:21px}.zb{height:46px}}
@media (orientation:landscape) and (max-height:500px){
  .app{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;column-gap:14px;row-gap:8px;max-width:none;height:100svh;
    padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(56px + env(safe-area-inset-right))}
  .brand{grid-column:1/-1;flex-direction:row;justify-content:space-between}
  .mark{height:24px}.word{height:17px}
  .hero{grid-column:1;grid-row:2/4;min-height:0}
  .deck{grid-column:2;grid-row:2;align-self:center;width:auto;height:100%;justify-self:center}
  .zrow{grid-column:2;grid-row:3}
}
</style>
</head>
<body>
<div class="curtain" id="curtain"></div>
<canvas id="gl"></canvas>
<button class="snd" id="snd" type="button" aria-label="Bật/tắt nhạc"><i><b></b><b></b><b></b><b></b></i></button>
<audio id="bgm" src="assets/music.m4a" preload="auto" playsinline></audio>

<main class="app" id="app">
  <header class="brand fade">
    <div class="lock">
      <img class="mark" src="https://media.deeplabassist.vn/assets/img/logo-mark-white.svg" width="40" height="33" alt="" onerror="this.onerror=null;this.src='assets/logo-96.png'">
      <img class="word" src="https://media.deeplabassist.vn/assets/img/logo-word-white.svg" width="151" height="26" alt="Deeplab" onerror="this.outerHTML='<b class=wordtxt>DEEPLAB</b>'">
    </div>
    <div class="tag"><i></i>Media · Production House<i></i></div>
  </header>

  <a class="hero fade" href="https://media.deeplabassist.vn">
    <img class="p" src="https://media.deeplabassist.vn/assets/img/hero-dior.webp" alt="" decoding="async" onerror="this.onerror=null;this.src='site.jpg'">
    <video data-src="https://media.deeplabassist.vn/assets/video/hero-dior.mp4" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video>
    <div class="row"><h1>Production<br>House</h1><span class="wbtn">Xem website</span></div>
  </a>

  <div class="deck" id="deck" role="button" tabindex="0" aria-label="Danh thiếp Deeplab">
    <div class="fb">
      <div class="card bot"><img src="assets/card_trinh.webp" alt="Danh thiếp Trần Thị Lâm Trinh"></div>
      <div class="card top"><img src="assets/card_sinh.webp" alt="Danh thiếp Dương Lâm Nhất Sinh"></div>
    </div>
  </div>

  <div class="zrow fade">
    <a class="zb" href="https://zalo.me/0345926347"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M24 12.5c-7.7 0-13.6 4.9-13.6 11.1 0 3.4 1.9 6.4 4.8 8.5-.2 1.7-1 3.2-2.2 4.3 2.4.2 4.6-.6 6.3-2 1.5.4 3.1.6 4.7.6 7.7 0 13.6-4.9 13.6-11.4S31.7 12.5 24 12.5z" fill="#0068ff"/><text x="24" y="26.6" text-anchor="middle" font-family="Arial" font-weight="800" font-size="8.6" fill="#fff">Zalo</text></svg><span>Nhất Sinh<small>Founder &amp; CEO</small></span></a>
    <a class="zb" href="https://zalo.me/0333596608"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M24 12.5c-7.7 0-13.6 4.9-13.6 11.1 0 3.4 1.9 6.4 4.8 8.5-.2 1.7-1 3.2-2.2 4.3 2.4.2 4.6-.6 6.3-2 1.5.4 3.1.6 4.7.6 7.7 0 13.6-4.9 13.6-11.4S31.7 12.5 24 12.5z" fill="#0068ff"/><text x="24" y="26.6" text-anchor="middle" font-family="Arial" font-weight="800" font-size="8.6" fill="#fff">Zalo</text></svg><span>Lâm Trinh<small>Creative Director</small></span></a>
  </div>
</main>

<script>
/* ── shared: music + page reveal + hero video (works with or without WebGL) ── */
window.DL=(function(){
  var bgm=document.getElementById('bgm'),snd=document.getElementById('snd'),t0=null,wanted=true,started=false;
  bgm.volume=0.9;
  function setUI(){snd.classList.toggle('off',!wanted||bgm.paused);}
  function tryPlay(at){
    if(!wanted) return Promise.resolve(false);
    if(typeof at==='number'&&at>=0&&at<bgm.duration-1){try{bgm.currentTime=at}catch(e){}}
    var p=bgm.play();
    return (p&&p.then?p:Promise.resolve()).then(function(){started=true;snd.classList.remove('wait');setUI();return true},function(){snd.classList.add('wait');setUI();return false});
  }
  function unlock(){
    if(started||!wanted) return;
    var at=t0===null?0:(performance.now()-t0)/1000;
    tryPlay(at);
  }
  ['pointerdown','touchend','click','keydown'].forEach(function(ev){window.addEventListener(ev,unlock,{passive:true,capture:true})});
  snd.addEventListener('click',function(e){
    e.stopPropagation();
    if(started&&!bgm.paused){wanted=false;bgm.pause();}
    else{wanted=true;tryPlay();}
    setUI();
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden){bgm.pause()}else if(wanted&&started){bgm.play().catch(function(){})}});
  function fadeTo(v,ms){var a=bgm.volume,s=performance.now();(function f(n){var k=Math.min(1,(n-s)/ms);bgm.volume=a+(v-a)*k;if(k<1)requestAnimationFrame(f)})(s)}
  var v=document.querySelector('.hero video'),vl=false;
  function loadVideo(){
    if(vl||!v) return; vl=true;
    var c=navigator.connection||{}; if(c.saveData||/(^|-)2g|3g/.test(c.effectiveType||'')) return;
    v.src=v.dataset.src;v.addEventListener('playing',function(){v.classList.add('on')},{once:true});
    var p=v.play();if(p&&p.catch)p.catch(function(){});
  }
  var dl;
  function fallback(why){
    if(dl.failed) return; dl.failed=why||true;
    document.documentElement.classList.remove('gl');
    var c=document.getElementById('gl'); if(c) c.style.display='none';
    dl.curtain(0); dl.reveal(1); dl.settle();
    if(t0===null){ t0=performance.now(); tryPlay(0); snd.classList.add('show'); }
  }
  var shown=0,lastV=performance.now();
  function watch(){
    var n=performance.now(); if(!document.hidden) shown+=n-lastV; lastV=n;
    if(window.__glOK||dl.failed) return;
    if(shown>4000){ fallback('timeout'); return; }
    setTimeout(watch,250);
  }
  setTimeout(watch,250);
  return dl={
    fallback:fallback, failed:false,
    start:function(){t0=performance.now();tryPlay(0);setTimeout(function(){snd.classList.add('show')},400)},
    reveal:function(k){[].forEach.call(document.querySelectorAll('.fade'),function(e){e.style.opacity=k})},
    curtain:function(k){var c=document.getElementById('curtain');c.style.opacity=k;c.style.display=k<=0?'none':'block'},
    settle:function(){fadeTo(0.55,1500);loadVideo()},
    still:window.matchMedia('(prefers-reduced-motion: reduce)').matches
  };
})();
</script>

<script src="assets/gl.js" defer></script>
</body>
</html>
