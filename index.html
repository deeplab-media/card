<style>
:root{--ink:#fff;--sub:rgba(255,255,255,.66);--zalo:#0068ff;--disp:"Anton",Impact,sans-serif;--ui:"Be Vietnam Pro",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overscroll-behavior-y:none}
body{background:#000;color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a,button{touch-action:manipulation;color:inherit;text-decoration:none;-webkit-user-select:none;user-select:none}
img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;display:block}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;gap:12px;overflow:clip;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}

/* brand */
.brand{display:flex;flex-direction:column;align-items:center;gap:7px}
.lock{position:relative;display:flex;align-items:center;gap:12px}
.lock::before{content:"";position:absolute;inset:-18px -40px;z-index:-1;background:radial-gradient(closest-side,rgba(120,190,255,.2),transparent);filter:blur(6px)}
.mark{height:36px;width:auto}.word{height:26px;width:auto}
.wordtxt{font-family:var(--disp);font-size:28px;letter-spacing:.12em}
.tag{display:flex;align-items:center;gap:10px;font-size:9.5px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--sub)}
.tag i{width:22px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5))}
.tag i:last-child{transform:scaleX(-1)}

/* hero */
.hero{position:relative;display:block;border-radius:22px;overflow:hidden;flex:1 1 30%;min-height:150px;isolation:isolate}
.hero video,.hero img.p{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero video{opacity:0;transition:opacity .8s}.hero video.on{opacity:1}
.hero img.p{animation:kb 18s ease-in-out infinite alternate;transform-origin:60% 40%}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-2%,1%)}}
@media (prefers-reduced-motion:reduce){.hero img.p{animation:none}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.85) 100%)}
.hero .row{position:absolute;left:0;right:0;bottom:0;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero h1{font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.02;text-transform:uppercase}
.wbtn{flex-shrink:0;height:42px;padding:0 16px;border-radius:13px;background:#fff;color:#000;font-size:13.5px;font-weight:700;display:flex;align-items:center}

/* deck slot (cards are drawn by WebGL on top of it) */
.deck{position:relative;flex:0 0 auto;width:100%;aspect-ratio:1.667/1.18;cursor:pointer;outline:none}
.fb .card{position:absolute;left:5%;width:90%;aspect-ratio:1203/721;top:10%;border-radius:3.2%/5.4%;overflow:hidden;box-shadow:0 22px 40px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07)}
.fb .card img{width:100%;height:100%}
.fb .top{z-index:2;transform:translate(1%,8%) rotate(2.2deg)}
.fb .bot{z-index:1;transform:translate(-2%,-7%) rotate(-5deg) scale(.95);filter:brightness(.78)}
.gl .fb{display:none}

/* zalo */
.zrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zb{height:50px;border-radius:15px;background:var(--zalo);display:flex;align-items:center;gap:9px;padding:0 12px;
  box-shadow:0 10px 24px rgba(0,104,255,.38);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.zb:active{transform:scale(.95)}
.zb svg{width:28px;height:28px;flex-shrink:0}
.zb span{display:flex;flex-direction:column;line-height:1.15;font-size:13.5px;font-weight:700}
.zb small{font-size:10px;font-weight:400;opacity:.8;white-space:nowrap}

/* layers */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
.curtain{position:fixed;inset:0;z-index:30;background:#000}
.snd{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:60;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .6s}
.snd.show{opacity:1}
.snd i{display:flex;align-items:flex-end;gap:2px;height:14px}
.snd i b{width:2.5px;background:#fff;border-radius:2px;height:4px;animation:eq 1s ease-in-out infinite}
.snd i b:nth-child(2){animation-delay:.2s}.snd i b:nth-child(3){animation-delay:.4s}.snd i b:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.snd.off i b{animation:none;height:3px;opacity:.6}
.snd.wait{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}60%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.fade{opacity:0}

@media (max-width:350px){.zb{gap:7px;padding:0 9px}.zb svg{width:24px;height:24px}.zb span{font-size:12.5px}.zb small{font-size:9px}}
@media (max-height:700px){.app{gap:9px}.hero{min-height:120px}.hero h1{font-size:28px}.mark{height:30px}.word{height:21px}.zb{height:46px}}
@media (orientation:landscape) and (max-height:500px){
  .app{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;column-gap:14px;row-gap:8px;max-width:none;height:100svh;
    padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(56px + env(safe-area-inset-right))}
  .brand{grid-column:1/-1;flex-direction:row;justify-content:space-between}
  .mark{height:24px}.word{height:17px}
  .hero{grid-column:1;grid-row:2/4;min-height:0}
  .deck{grid-column:2;grid-row:2;align-self:center;width:auto;height:100%;justify-self:center}
  .zrow{grid-column:2;grid-row:3}
}

/* tap-to-open gate (only shown when the phone blocks sound) */
.gate{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:opacity .45s ease}
.gate.show{display:flex}.gate.hide{opacity:0;pointer-events:none}
.g-orb{position:relative;width:104px;height:104px;display:grid;place-items:center}
.g-orb img{width:44px;height:44px;position:relative;filter:drop-shadow(0 0 14px rgba(255,255,255,.45));animation:gbreath 2.4s ease-in-out infinite}
.g-orb::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(closest-side,rgba(220,225,235,.18),transparent);animation:gbreath 2.4s ease-in-out infinite}
.g-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.g-track{fill:none;stroke:rgba(255,255,255,.12);stroke-width:1.5}
.g-prog{fill:none;stroke:#e9ecf2;stroke-width:2;stroke-linecap:round;stroke-dasharray:301.6;stroke-dashoffset:301.6;transition:stroke-dashoffset .35s ease;filter:drop-shadow(0 0 4px rgba(255,255,255,.6))}
.gate.ready .g-ring{animation:gpulse 1.8s ease-out infinite}
.g-txt{font-size:10px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.62);padding-left:.42em;opacity:0;transition:opacity .6s .3s}
.gate.show .g-txt{opacity:1}.gate.loading .g-txt{opacity:.25}
@keyframes gbreath{50%{transform:scale(1.08);opacity:.85}}
@keyframes gpulse{0%{transform:rotate(-90deg) scale(1);opacity:1}70%{transform:rotate(-90deg) scale(1.35);opacity:0}100%{opacity:0}}
</style>
</head>
<body>
<div class="curtain" id="curtain"></div>
<canvas id="gl"></canvas>
<div class="gate" id="gate" role="button" aria-label="Mở danh thiếp">
  <div class="g-orb">
    <svg class="g-ring" viewBox="0 0 104 104"><circle cx="52" cy="52" r="48" class="g-track"/><circle cx="52" cy="52" r="48" class="g-prog" id="gateRing"/></svg>
    <img src="assets/logo-96.png" width="44" height="44" alt="">
  </div>
  <div class="g-txt">Chạm để mở</div>
</div>

<main class="app" id="app">
  <header class="brand fade">
    <div class="lock">
      <img class="mark" src="https://media.deeplabassist.vn/assets/img/logo-mark-white.svg" width="40" height="33" alt="" onerror="this.onerror=null;this.src='assets/logo-96.png'">
      <img class="word" src="https://media.deeplabassist.vn/assets/img/logo-word-white.svg" width="151" height="26" alt="Deeplab" onerror="this.outerHTML='<b class=wordtxt>DEEPLAB</b>'">

  <a class="hero fade" href="https://media.deeplabassist.vn">

      <div class="card top"><img src="assets/card_sinh.webp" crossorigin="anonymous" alt="Danh thiếp Dương Lâm Nhất Sinh"></div>

  <div class="zrow fade">
    <a class="zb" href="https://zalo.me/0345926347"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M24 12.5c-7.7 0-13.6 4.9-13.6 11.1 0 3.4 1.9 6.4 4.8 8.5-.2 1.7-1 3.2-2.2 4.3 2.4.2 4.6-.6 6.3-2 1.5.4 3.1.6 4.7.6 7.7 0 13.6-4.9 13.6-11.4S31.7 12.5 24 12.5z" fill="#0068ff"/><text x="24" y="26.6" text-anchor="middle" font-family="Arial" font-weight="800" font-size="8.6" fill="#fff">Zalo</text></svg><span>Nhất Sinh<small>Founder &amp; CEO</small></span></a>
    <a class="zb" href="https://zalo.me/0333596608"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M24 12.5c-7.7 0-13.6 4.9-13.6 11.1 0 3.4 1.9 6.4 4.8 8.5-.2 1.7-1 3.2-2.2 4.3 2.4.2 4.6-.6 6.3-2 1.5.4 3.1.6 4.7.6 7.7 0 13.6-4.9 13.6-11.4S31.7 12.5 24 12.5z" fill="#0068ff"/><text x="24" y="26.6" text-anchor="middle" font-family="Arial" font-weight="800" font-size="8.6" fill="#fff">Zalo</text></svg><span>Lâm Trinh<small>Creative Director</small></span></a>
  </div>
</main>

<script>
/* ── shared: music + page reveal + hero video (works with or without WebGL) ── */
window.DL=(function(){
  var bgm=document.getElementById('bgm'),snd=document.getElementById('snd'),gate=document.getElementById('gate'),ring=document.getElementById('gateRing');
  var wanted=true,canAuto=null,tapped=false,readyFn=null,begun=false,audioOn=false,t0=null,dl;
  bgm.volume=0.9;
  function setUI(){snd.classList.toggle('off',!wanted||bgm.paused);}
  function play(at){
    if(!wanted) return;
    try{ if(typeof at==='number') bgm.currentTime=at; }catch(e){}
    var p=bgm.play();
    if(p&&p.then) p.then(function(){audioOn=true;snd.classList.remove('wait');setUI();},function(){audioOn=false;snd.classList.add('wait');setUI();});
    else { audioOn=true; setUI(); }
  }
  function showGate(){ if(!begun&&!(dl&&dl.failed)) gate.classList.add('show'); }
  function hideGate(){ gate.classList.add('hide'); setTimeout(function(){gate.style.display='none'},500); }

  /* autoplay probe — the first half-second of the track is silence, so this is inaudible */
  (function probe(){
    if(/[?&]gate(=|&|$)/.test(location.search)){ canAuto=false; showGate(); return; }   // test hook
    var p=null; try{ p=bgm.play(); }catch(e){}
    if(p&&p.then){ p.then(function(){ if(!begun){bgm.pause();try{bgm.currentTime=0}catch(e){}} canAuto=true; maybeBegin(); },
                         function(){ canAuto=false; showGate(); }); }
    else { canAuto=false; showGate(); }
  })();

  function begin(){
    if(begun) return; begun=true; hideGate(); t0=performance.now(); primeVideo(tapped);
    play(0); setTimeout(function(){snd.classList.add('show')},400);
    if(readyFn) readyFn();
  }
  function maybeBegin(){ if(begun||(dl&&dl.failed)||!readyFn) return; if(canAuto===true||tapped) begin(); }
  function onTap(e){
    if(tapped||begun) return; tapped=true;
    if(readyFn){ begin(); return; }                 // ready → music + intro start together, inside the gesture
    var p=null; try{ p=bgm.play(); }catch(err){}    // not ready yet → unlock audio now, start later
    if(p&&p.then) p.then(function(){ if(!begun){bgm.pause();try{bgm.currentTime=0}catch(err){}} },function(){});
    primeVideo(true);
    gate.classList.add('loading');
  }
  gate.addEventListener('click',onTap); gate.addEventListener('touchend',function(e){e.preventDefault();onTap(e);},{passive:false});

  /* any later touch (fallback mode or a blocked play) starts the music where it should be */
  function unlock(){ if(!vOff&&vWant&&v&&v.paused&&vPrimed){ var q=v.play(); if(q&&q.catch) q.catch(function(){}); }
    if(!begun||audioOn||!wanted) return; var at=t0===null?0:(performance.now()-t0)/1000; play(at<bgm.duration-1?at:0); }
  ['pointerdown','touchend','click','keydown'].forEach(function(ev){window.addEventListener(ev,unlock,{passive:true,capture:true})});
  snd.addEventListener('click',function(e){ e.stopPropagation(); if(!bgm.paused){wanted=false;bgm.pause();} else {wanted=true;play();} setUI(); });
  document.addEventListener('visibilitychange',function(){ if(document.hidden){bgm.pause()} else if(wanted&&audioOn){bgm.play().catch(function(){})} });

  function fadeTo(v,ms){var a=bgm.volume,s=performance.now();(function f(n){var k=Math.min(1,(n-s)/ms);bgm.volume=a+(v-a)*k;if(k<1)requestAnimationFrame(f)})(s)}
  var v=document.querySelector('.hero video'),vPrimed=false,vWant=false;
  function slowNet(){ var c=navigator.connection||{}; return !!(c.saveData||/(^|-)2g|3g/.test(c.effectiveType||'')); }
  /* start downloading early; if we're inside a tap, "bless" the element so in-app browsers allow play later */
  /* in-app browsers (Zalo, Facebook, Messenger, Instagram, Line, TikTok) may force native fullscreen → no video there */
  var inApp=/Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|musical_ly|BytedanceWebview|TikTok/i.test(navigator.userAgent);
  var vOff=inApp;
  function killVideo(){ vOff=true; vWant=false; if(!v) return; try{ if(v.webkitDisplayingFullscreen&&v.webkitExitFullscreen) v.webkitExitFullscreen(); }catch(e){}
    try{ if(document.fullscreenElement===v&&document.exitFullscreen) document.exitFullscreen(); }catch(e){}
    try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} v.classList.remove('on'); v.style.display='none'; }
  if(v){ v.addEventListener('webkitbeginfullscreen',killVideo); v.addEventListener('fullscreenchange',function(){ if(document.fullscreenElement===v) killVideo(); }); }
  function primeVideo(inGesture){
    if(vOff||vPrimed||!v||slowNet()) return; vPrimed=true;
    v.muted=true; v.defaultMuted=true; v.setAttribute('muted',''); v.playsInline=true; v.preload='auto';
    v.addEventListener('playing',function(){v.classList.add('on')});
    v.src=v.dataset.src; try{v.load()}catch(e){}
    if(inGesture){ var p=v.play(); if(p&&p.then) p.then(function(){ if(!vWant) v.pause(); },function(){}); }
  }
  function playVideo(){
    if(vOff) return; vWant=true; if(!vPrimed) primeVideo(false); if(!vPrimed) return;
    if(!v.paused) return; var p=v.play(); if(p&&p.catch) p.catch(function(){});
  }
  function fallback(why){
    if(dl.failed) return; dl.failed=why||true;
    document.documentElement.classList.remove('gl');
    var c=document.getElementById('gl'); if(c) c.style.display='none';
    hideGate(); primeVideo(false); dl.curtain(0); dl.reveal(1); dl.settle();
    if(!begun){ begun=true; t0=performance.now(); if(canAuto!==false||tapped) play(0); }
    snd.classList.add('show');
  }
  /* watchdog: patient while downloading/booting (counts visible time only) */
  var shown=0,lastV=performance.now();
  function watch(){
    var n=performance.now(),dv=document.hidden?0:n-lastV; lastV=n; shown+=dv;
    if(window.__glOK||dl.failed) return;
    if(shown>15000){ fallback('timeout'); return; }
    setTimeout(watch,250);
  }
  setTimeout(watch,250);
  return dl={
    fallback:fallback, failed:false,
    onReady:function(fn,now){ readyFn=fn; gate.classList.remove('loading'); gate.classList.add('ready'); if(now){begun=true;hideGate();fn();return;} maybeBegin(); },
    progress:function(p){ if(ring) ring.style.strokeDashoffset=String(301.6*(1-Math.max(0,Math.min(1,p)))); },
    musicTime:function(){ return (audioOn&&!bgm.paused)?bgm.currentTime:null; },
    /* call back once sound is really coming out (or after a short grace period) with the music position */
    whenAudible:function(cb){
      var done=false; function go(){ if(done) return; done=true; cb(audioOn&&!bgm.paused?bgm.currentTime:0); }
      if(!wanted||!begun){ go(); return; }
      if(!bgm.paused&&bgm.currentTime>0){ go(); return; }
      bgm.addEventListener('playing',function(){ setTimeout(go,30); },{once:true});
      setTimeout(go,450);
    },
    reveal:function(k){ if(k>0.01&&!vWant) playVideo(); [].forEach.call(document.querySelectorAll('.fade'),function(e){e.style.opacity=k})},
    curtain:function(k){var c=document.getElementById('curtain');c.style.opacity=k;c.style.display=k<=0?'none':'block'},
    settle:function(){fadeTo(0.55,1500);playVideo()},
    still:window.matchMedia('(prefers-reduced-motion: reduce)').matches
  };
})();
</script>
